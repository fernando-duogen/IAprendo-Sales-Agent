[pytest]
# Coleta SO a pasta tests/ — os test_*.py da raiz (test_fase1.py, test_migrations.py)
# sao SCRIPTS legados (rodam sys.exit no import) e quebrariam a coleta do pytest.
testpaths = tests
addopts = -q
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: roda a pagina inteira via AppTest contra o banco real (dezenas de segundos).
          Pular com: pytest -m "not slow"
