name: Keep Streamlit app awake

# Mantem o app do Streamlit Community Cloud acordado abrindo uma SESSAO REAL de
# navegador (Playwright/Chromium headless) — ver scripts/keep_awake.py.
#
# Por que mudou: a versao antiga fazia so um curl (ping HTTP). O Streamlit so
# reseta o timer de inatividade quando ha uma sessao websocket de verdade (JS
# carregado no navegador); o curl recebia 200 mas NUNCA abria essa sessao, entao
# o app dormia mesmo com o "ping" dando sucesso. O robo agora carrega o app de
# verdade e ainda clica em "Yes, get this app back up!" se estiver dormindo.
#
# Janela: dias uteis, ~06h-21h BRT (09-23 UTC), a cada 15 min. O GitHub as vezes
# atrasa/pula agendamentos (best-effort), por isso a frequencia alta da varias
# chances. Para 24/7, troque o cron por "*/15 * * * *". Para incluir sabado,
# use "1-6" no campo de dia-da-semana.

on:
  schedule:
    - cron: "*/15 9-23 * * 1-5"   # ~06h-21h BRT, seg-sex
  workflow_dispatch: {}            # permite rodar manualmente pela aba Actions

permissions:
  contents: read                   # so pra checkout do script

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Playwright + Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Abrir o app num navegador real (mantem a sessao = acordado)
        env:
          KEEPALIVE_URL: "https://iaprendo-sales-agent.streamlit.app/"
        run: python scripts/keep_awake.py
