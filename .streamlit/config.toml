[server]
headless = true
port = 8501
# enableCORS = false  # REMOVIDO: incompativel com enableXsrfProtection=true (warning)
# Padrao Streamlit eh CORS=true + XSRF=true (mais seguro). Sem warning.
enableXsrfProtection = true

[theme]
primaryColor = "#1976D2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7FB"
textColor = "#1A202C"
font = "sans serif"

[browser]
gatherUsageStats = false
