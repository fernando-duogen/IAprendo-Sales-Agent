[server]
headless = true
port = 8501
# enableCORS = false  # REMOVIDO: incompativel com enableXsrfProtection=true (warning)
# Padrao Streamlit eh CORS=true + XSRF=true (mais seguro). Sem warning.
enableXsrfProtection = true

[theme]
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#1E293B"
font = "sans serif"

[browser]
gatherUsageStats = false
